spring:
  application:
    name: catalog-service
  main:
    web-application-type: reactive
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: false

spamer:
  security:
    jwt:
      secret: test-secret-for-integration-tests-0123456789
      issuer: spamer

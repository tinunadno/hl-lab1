server:
  port: ${GATEWAY_PORT:8080}

spamer:
  gateway:
    # /spam/send may legitimately POST up to 100 messages, so this is well above
    # the timeouts of the services behind the gateway.
    timeout-seconds: 60

spring:
  cloud:
    gateway:
      server:
        webflux:
          # /internal/** is deliberately not routed: it is service-to-service only.
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/subscriptions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback/user-service
            - id: catalog-service
              uri: lb://catalog-service
              predicates:
                - Path=/api/v1/services/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalog-service
                    fallbackUri: forward:/fallback/catalog-service
            - id: dispatch-service
              uri: lb://dispatch-service
              predicates:
                - Path=/api/v1/proxy/**,/api/v1/spam-log/**,/api/v1/spam/**,/api/v1/test-receiver/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: dispatch-service
                    fallbackUri: forward:/fallback/dispatch-service
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
            - id: catalog-service-docs
              uri: lb://catalog-service
              predicates:
                - Path=/api-docs/catalog-service
              filters:
                - SetPath=/v3/api-docs
            - id: dispatch-service-docs
              uri: lb://dispatch-service
              predicates:
                - Path=/api-docs/dispatch-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /api-docs/user-service
      - name: catalog-service
        url: /api-docs/catalog-service
      - name: dispatch-service
        url: /api-docs/dispatch-service

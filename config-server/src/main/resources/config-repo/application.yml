# Shared by every client of the Config Server. ${...} placeholders are resolved
# on the client, so secrets and addresses stay in environment variables.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

spamer:
  circuit-breaker:
    sliding-window-size: 10
    minimum-calls: 5
    failure-rate-percent: 50
    open-state-seconds: 10
    timeout-seconds: 5

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 4000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

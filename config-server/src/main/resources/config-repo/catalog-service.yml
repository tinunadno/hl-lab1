server:
  port: 8082

spring:
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/spamer_catalog}
    username: ${DB_USERNAME:spamer}
    password: ${DB_PASSWORD:spamer}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

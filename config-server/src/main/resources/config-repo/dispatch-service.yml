server:
  port: 8083

spring:
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/spamer_dispatch}
    username: ${DB_USERNAME:spamer}
    password: ${DB_PASSWORD:spamer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

spamer:
  sender:
    # The only place messages can go. It comes from operator config, never from
    # a request. Defaults to the receiver built into this service.
    target-url: ${SENDER_TARGET_URL:http://localhost:8083/api/v1/test-receiver/inbox}
    connect-timeout-ms: ${SENDER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SENDER_READ_TIMEOUT_MS:5000}
  refund:
    retry-delay-ms: ${REFUND_RETRY_DELAY_MS:30000}

spring:
  application:
    name: dispatch-service
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: false

spamer:
  security:
    jwt:
      secret: test-secret-for-integration-tests-0123456789
      issuer: spamer
  limits:
    free-max-messages: 10
  sender:
    target-url: http://localhost:8083/api/v1/test-receiver/inbox
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  refund:
    retry-delay-ms: 3600000

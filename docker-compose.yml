services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME:-spamer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spamer}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USERNAME:-spamer} -d spamer_dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata-lab2:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CONFIG_REPO_URI: file:///config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on:
      eureka-server:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      USER_DB_R2DBC_URL: r2dbc:postgresql://db:5432/spamer_users
      USER_DB_JDBC_URL: jdbc:postgresql://db:5432/spamer_users
      DB_USERNAME: ${DB_USERNAME:-spamer}
      DB_PASSWORD: ${DB_PASSWORD:-spamer}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  catalog-service:
    build:
      context: .
      args:
        MODULE: catalog-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      CATALOG_DB_URL: jdbc:postgresql://db:5432/spamer_catalog
      DB_USERNAME: ${DB_USERNAME:-spamer}
      DB_PASSWORD: ${DB_PASSWORD:-spamer}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  dispatch-service:
    build:
      context: .
      args:
        MODULE: dispatch-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
      DISPATCH_DB_URL: jdbc:postgresql://db:5432/spamer_dispatch
      DB_USERNAME: ${DB_USERNAME:-spamer}
      DB_PASSWORD: ${DB_PASSWORD:-spamer}
      SENDER_TARGET_URL: ${SENDER_TARGET_URL:-http://localhost:8083/api/v1/test-receiver/inbox}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  pgdata-lab2:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.10.0/24

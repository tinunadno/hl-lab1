server:
  port: ${EUREKA_PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # A single-node registry on a laptop: don't keep dead instances around.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health

databaseChangeLog:
  - changeSet:
      id: 003-create-balance-operations
      author: lab
      changes:
        - createTable:
            tableName: balance_operations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_balance_operations_user
            baseTableName: balance_operations
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: >-
              ALTER TABLE balance_operations ADD CONSTRAINT chk_balance_operations_status
              CHECK (status IN ('CHARGED', 'REFUNDED'))
        - sql:
            sql: >-
              ALTER TABLE balance_operations ADD CONSTRAINT chk_balance_operations_amount
              CHECK (amount >= 0)

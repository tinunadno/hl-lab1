spring:
  application:
    name: user-service
  main:
    web-application-type: reactive
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: false

spamer:
  security:
    jwt:
      secret: test-secret-for-integration-tests-0123456789
      issuer: spamer
    bootstrap:
      username: root
      password: root-password-123
